; Cardputer SD bridge - lets CardputerTools manage the microSD card over USB.
;   pio run -t upload
[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5GFX
    m5stack/M5Unified@^0.3.0
